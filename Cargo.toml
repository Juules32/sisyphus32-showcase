[package]
name = "portfolio"
version = "0.1.0"
authors = ["juules32 <56916699+Juules32@users.noreply.github.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = ["router"] }
dioxus-logger = "0.6.2"
gloo-timers = { version = "0.3.0", features = ["futures"] }
sisyphus32 = { version = "1.3.3", default-features = false, features = ["all_wasm"] }
# sisyphus32 = { path = "../sisyphus32", features = ["all_wasm"] }
web-sys = { version = "0.3", features = ["HtmlAudioElement"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
